<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בדיקת מצלמה</title>
    <style>
        body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: height; height: 100vh; margin: 0; font-family: Arial, sans-serif; }
        video { width: 400px; height: 300px; background: #000; border-radius: 10px; transform: scaleX(-1); border: 2px solid #333; margin-top: 15px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #00e676; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>בדיקת מצלמה מהירה</h2>
    <button id="camBtn">הפעל מצלמה</button>
    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        const videoElement = document.getElementById('localVideo');
        const camBtn = document.getElementById('camBtn');

        async function getCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoElement.srcObject = stream;
            } catch (err) {
                console.error("שגיאה בגישה למצלמה:", err);
                alert("ודא שהדפדפן מורשה לגשת למצלמה ואין תוכנה אחרת שתופסת אותה.");
            }
        }

        // ניסיון הפעלה אוטומטי
        window.addEventListener('load', getCamera);

        // הפעלה בלחיצת כפתור למקרה שהדפדפן חוסם אוטומטים
        camBtn.addEventListener('click', getCamera);
    </script>
</body>
</html>
