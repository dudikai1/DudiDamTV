<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DudiDamTV</title>
    <style>
        body {
            margin: 0;
            background-color: #181818;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
        }
        .tv-container {
            position: relative;
            width: 800px;
            max-width: 80vw;
            height: 450px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #remotePlaceholder {
            font-size: 24px;
            color: #888;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        #remotePlaceholder img {
            margin-bottom: 15px;
            max-width: 100px;
        }
        #remoteVideo {
            display: none; 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }
        .chat-container {
            width: 300px;
            background-color: #212121;
            border-radius: 12px;
            padding: 15px;
            height: 450px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .chat-header {
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            font-size: 14px;
            color: #ccc;
        }
        .chat-input-area {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        #msgInput {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
        }
        #sendMsgBtn {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background-color: #00c853;
            color: #fff;
            cursor: pointer;
        }
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
        }
        .btn-start {
            background-color: #0b3d20;
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            padding: 30px 50px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
            width: 240px;
            height: 150px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-stop {
            background-color: #4a2522;
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            padding: 30px 50px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
            width: 240px;
            height: 150px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-start:active, .btn-stop:active {
            transform: translateY(2px);
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #aaa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="tv-container">
            <div id="remotePlaceholder">
                <img src="https://i.ibb.co/xYm813k/dudidam-tv-logo.png" alt="DudiDamTV Logo">
                לחץ על התחל כדי להתחיל
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div class="chat-container">
            <div class="chat-header">צ'אט</div>
            <div id="messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="כתוב הודעה...">
                <button id="sendMsgBtn">שלח</button>
            </div>
        </div>
    </div>

    <div id="status">מוכן</div>

    <div class="controls">
        <button id="startBtn" class="btn-start">התחל</button>
        <button id="stopBtn" class="btn-stop">עצור</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const msgInput = document.getElementById('msgInput');
        const sendMsgBtn = document.getElementById('sendMsgBtn');
        const messagesContainer = document.getElementById('messages');
        let localStream = null;

        const socket = io();

        async function startSearch() {
            try {
                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                }
                statusDiv.textContent = 'מחפש משתמש...';
                remotePlaceholder.style.display = 'none';
                remoteVideo.style.display = 'block';
                // הדמה את הוידאו המרוחק עם הוידאו המקומי לבדיקה (תחליף את זה בזרם האמיתי מהשרת)
                remoteVideo.srcObject = localStream; 
                
                socket.emit('find-partner');
            } catch (err) {
                console.error('שגיאה בגישה למצלמה:', err);
                statusDiv.textContent = 'שגיאה בגישה למצלמה';
                remotePlaceholder.innerHTML = '<span style="color:red;">שגיאה בגישה למצלמה. בדוק הרשאות.</span>';
            }
        }

        function stopSearch() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (remoteVideo) remoteVideo.pause();
            remoteVideo.srcObject = null;
            remoteVideo.style.display = 'none';
            remotePlaceholder.style.display = 'flex';
            remotePlaceholder.innerHTML = '<img src="https://i.ibb.co/xYm813k/dudidam-tv-logo.png" alt="DudiDamTV Logo">לחץ על התחל כדי להתחיל';
            statusDiv.textContent = 'הופסק';
            socket.emit('stop-search');
        }

        startBtn.addEventListener('click', startSearch);
        stopBtn.addEventListener('click', stopSearch);

        socket.on('update-user-count', (userCount) => {
            // כאן אפשר להוסיף לוגיקה לעדכון מונה המשתמשים אם רוצים.
        });

        socket.on('new-message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.textContent = `${data.username}: ${data.text}`;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text) {
                socket.emit('send-message', text);
                const msgDiv = document.createElement('div');
                msgDiv.textContent = `אני: ${text}`;
                msgDiv.style.color = '#00c853';
                messagesContainer.appendChild(msgDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                msgInput.value = '';
            }
        }

        sendMsgBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
