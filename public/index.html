<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissim TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .tv-logo-box {
            background-color: #ff8a65;
            width: 180px;
            height: 115px;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid #ff7043;
        }

        .tv-logo-box::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(-30deg);
            border-radius: 2px;
        }
        .tv-logo-box::after {
            content: '';
            position: absolute;
            top: -20px;
            right: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(30deg);
            border-radius: 2px;
        }

        .tv-buttons {
            position: absolute;
            right: 10px;
            top: 35px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tv-btn-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
        }

        .tv-title-1 { color: #fff; font-size: 30px; font-weight: bold; font-family: monospace; letter-spacing: 1px; }
        .tv-title-2 { color: #69f0ae; font-size: 32px; font-weight: bold; font-family: monospace; }

        #main-app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        header { background-color: #1f1f1f; padding: 10px; text-align: center; font-size: 18px; font-weight: bold; color: #00e676; border-bottom: 2px solid #333; }
        
        .main-container { display: flex; flex-direction: column; flex: 1; position: relative; overflow: hidden; }
        
        .video-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background-color: #000; 
            position: relative; 
            padding: 10px; 
        }
        
        .videos { display: flex; width: 100%; height: 72%; gap: 10px; justify-content: center; align-items: center; }
        
        .video-box {
            width: 48%;
            height: 100%;
            position: relative;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
        }

        video { width: 100%; height: 100%; object-fit: cover; background-color: #1a1a1a; }
        #localVideo { transform: scaleX(-1); }

        #remotePlaceholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            background-color: #181818;
        }

        /* אזור הבקרה והצ'אט שיושבים אחד ליד השני תחת הווידאו */
        .bottom-row {
            margin-top: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 15px;
        }

        .controls { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
        }
        
        .ctrl-giant-btn {
            font-size: 26px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 140px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-giant-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        #startBtn { 
            background-color: #133a27;
            color: #b0c4bc;            
        }
        
        #stopBtn { 
            background-color: #3b2826;  
            color: #b8aaa7;            
        }
        
        /* צ'אט מותאם שיושב מיד ליד כפתור ההתחל */
        .chat-container { 
            width: 450px;
            height: 70px;
            background-color: rgba(28, 28, 28, 0.95);
            border-radius: 12px;
            display: flex; 
            flex-direction: column; 
            border: 1px solid #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .messages { flex: 1; padding: 6px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; background: #181818; }
        .message { background-color: #333; padding: 3px 6px; border-radius: 4px; max-width: 90%; word-break: break-word; }
        .message.self { align-self: flex-start; background-color: #00e676; color: #000; }
        .chat-input { display: flex; padding: 5px; background-color: #222; border-top: 1px solid #333; }
        .chat-input input { flex: 1; padding: 5px; border: none; border-radius: 4px; background-color: #333; color: #fff; font-size: 12px; outline: none; }
        .chat-input button { background-color: #00e676; color: #000; padding: 0 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; margin-right: 5px; font-size: 12px; }
        
        #status { position: absolute; top: 15px; background: rgba(0, 0, 0, 0.7); padding: 6px 14px; border-radius: 20px; font-size: 13px; z-index: 10; }

        @media (max-width: 900px) {
            .bottom-row { flex-direction: column; }
            .chat-container { width: 100%; height: 100px; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="main-app">
        <header>Nissim TV</header>
        <div class="main-container">
            <!-- אזור הווידאו -->
            <div class="video-container">
                <div id="status">לחץ על "התחל" כדי להתחבר</div>
                <div class="videos">
                    <div class="video-box">
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>

                    <div class="video-box" id="remoteBox">
                        <div id="remotePlaceholder">
                            <div class="tv-logo-box">
                                <div class="tv-buttons">
                                    <div class="tv-btn-dot"></div>
                                    <div class="tv-btn-dot"></div>
                                </div>
                                <div class="tv-title-1" style="font-size: 22px;">NISSIM</div>
                                <div class="tv-title-2" style="font-size: 26px;">TV</div>
                            </div>
                        </div>
                        <video id="remoteVideo" autoplay playsinline style="display: none; width: 100%; height: 100%; object-fit: cover;"></video>
                    </div>
                </div>
                
                <!-- שורה תחתונה המאגדת את הכפתורים ואת הצ'אט בדיוק לידם -->
                <div class="bottom-row">
                    <div class="controls">
                        <button class="ctrl-giant-btn" id="startBtn">התחל</button>
                        <button class="ctrl-giant-btn" id="stopBtn">עצור</button>
                    </div>

                    <!-- הצ'אט ממוקם ממש פה ליד הכפתורים -->
                    <div class="chat-container">
                        <div class="messages">
                            <div class="message">ברוך הבא ל-Nissim TV! על ידי לחיצה על "התחל", אתה מסכים לחוקים שלנו. ודא שפניך נראים בתוך מסגרת המצלמה.</div>
                        </div>
                        <div class="chat-input">
                            <input type="text" id="msgInput" placeholder="כתוב הודעה...">
                            <button id="sendMsgBtn">שלח</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusDiv = document.getElementById('status');

        let localStream = null;
        let peerConnection = null;
        let currentPartnerId = null;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.textContent = 'המצלמה פועלת. לחץ על "התחל"';
            } catch (err) {
                statusDiv.textContent = 'שגיאה: אין גישה למצלמה';
            }
        }
        initCamera();

        startBtn.addEventListener('click', async () => {
            if (!localStream) {
                await initCamera();
                if (!localStream) return;
            }
            statusDiv.textContent = 'מחפש משתמש פנוי...';
            socket.emit('find-partner');
        });

        stopBtn.addEventListener('click', () => {
            resetPeerConnection();
            socket.emit('skip');
            statusDiv.textContent = 'השיחה נעצרה. לחץ על "התחל" לחיפוש חדש';
        });

        socket.on('waiting', () => {
            statusDiv.textContent = 'מחפש משתמשים נוספים...';
            resetPeerConnection();
        });

        socket.on('matched', async (data) => {
            currentPartnerId = data.partnerId;
            statusDiv.textContent = 'התחברת למשתמש! יוצר שיחה...';
            
            peerConnection = new RTCPeerConnection(iceServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = 'block';
                remotePlaceholder.style.display = 'none';
                statusDiv.textContent = 'מחובר!';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { offer, target: currentPartnerId });
            }
        });

        socket.on('offer', async (data) => {
            currentPartnerId = data.sender;
            peerConnection = new RTCPeerConnection(iceServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = 'block';
                remotePlaceholder.style.display = 'none';
                statusDiv.textContent = 'מחובר!';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { answer, target: currentPartnerId });
        });

        socket.on('answer', async (data) => {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        socket.on('partner-disconnected', () => {
            statusDiv.textContent = 'המשתמש השני התנתק. מחפש חדש...';
            resetPeerConnection();
            socket.emit('find-partner');
        });

        function resetPeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            remoteVideo.style.display = 'none';
            remotePlaceholder.style.display = 'flex';
            currentPartnerId = null;
        }

        const sendMsgBtn = document.getElementById('sendMsgBtn');
        const msgInput = document.getElementById('msgInput');
        const messagesContainer = document.querySelector('.messages');

        const sendMessage = () => {
            const text = msgInput.value.trim();
            if (text !== '') {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message self';
                msgDiv.textContent = text;
                messagesContainer.appendChild(msgDiv);
                msgInput.value = '';
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        };

        sendMsgBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
