<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissim TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .tv-logo-box {
            background-color: #ff8a65;
            width: 220px;
            height: 140px;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid #ff7043;
        }

        .tv-logo-box::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 55px;
            width: 5px;
            height: 25px;
            background-color: #ff8a65;
            transform: rotate(-30deg);
            border-radius: 2px;
        }
        .tv-logo-box::after {
            content: '';
            position: absolute;
            top: -25px;
            right: 55px;
            width: 5px;
            height: 25px;
            background-color: #ff8a65;
            transform: rotate(30deg);
            border-radius: 2px;
        }

        .tv-buttons {
            position: absolute;
            right: 12px;
            top: 45px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tv-btn-dot {
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
        }

        .tv-title-1 { color: #fff; font-size: 36px; font-weight: bold; font-family: monospace; letter-spacing: 1px; }
        .tv-title-2 { color: #69f0ae; font-size: 38px; font-weight: bold; font-family: monospace; }

        #main-app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        header { background-color: #1f1f1f; padding: 10px; text-align: center; font-size: 18px; font-weight: bold; color: #00e676; border-bottom: 2px solid #333; }
        
        .main-container { display: flex; flex-direction: column; flex: 1; position: relative; overflow: hidden; }
        
        .video-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background-color: #000; 
            position: relative; 
            padding: 10px; 
            gap: 10px;
        }
        
        .videos { display: flex; width: 100%; flex: 1; gap: 10px; justify-content: center; align-items: center; }
        
        .video-box {
            width: 49%;
            height: 100%;
            position: relative;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
        }

        video { width: 100%; height: 100%; object-fit: cover; background-color: #1a1a1a; }
        #localVideo { transform: scaleX(-1); }

        #remotePlaceholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            background-color: #181818;
            gap: 20px;
        }

        .app-stores {
            display: flex;
            gap: 15px;
            background: #111;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .store-badge { color: #fff; font-size: 13px; display: flex; flex-direction: column; }
        .store-badge span { font-weight: bold; font-size: 15px; }

        /* שורה תחתונה: כפתורים באמצע וצ'אט בצד ימין */
        .bottom-panel {
            display: flex;
            gap: 12px;
            height: 110px;
            width: 100%;
            align-items: center;
        }

        .controls-group {
            display: flex;
            gap: 12px;
            height: 100%;
            width: 320px;
        }

        .ctrl-btn {
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
        }

        #startBtn { background-color: #66bb6a; color: #fff; font-size: 26px; }
        #stopBtn { background-color: #ffab91; color: #fff; font-size: 26px; }

        /* צ'אט תחתון בצד ימין */
        .chat-container { 
            flex: 1;
            height: 100%;
            background-color: #fff;
            border-radius: 12px;
            display: flex; 
            flex-direction: column; 
            border: 1px solid #ccc;
            overflow: hidden;
            color: #333;
            position: relative;
        }
        .messages { flex: 1; padding: 6px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
        .message { background-color: #e0e0e0; padding: 4px 8px; border-radius: 6px; max-width: 90%; word-break: break-word; }
        .message.self { align-self: flex-start; background-color: #c8e6c9; color: #000; }
        
        .chat-rules-banner {
            background-color: #fffde7;
            border-bottom: 1px solid #fff59d;
            padding: 4px 10px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-input { display: flex; padding: 4px 8px; background-color: #f1f1f1; border-top: 1px solid #ddd; align-items: center; }
        .chat-input input { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 4px; background-color: #fff; color: #000; font-size: 13px; outline: none; }
        .chat-input .emoji-btn { background: none; border: none; font-size: 16px; cursor: pointer; padding: 0 6px; }
        .chat-input .send-btn { background: #66bb6a; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 6px; }
        
        #status { position: absolute; top: 15px; left: 20px; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; z-index: 10; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="main-app">
        <header>Nissim TV</header>
        <div class="main-container">
            <div class="video-container">
                <div id="status">לחץ על "התחל" כדי להתחבר</div>
                <div class="videos">
                    <!-- מסך צד שני (שמאל) -->
                    <div class="video-box" id="remoteBox">
                        <div id="remotePlaceholder">
                            <div class="tv-logo-box">
                                <div class="tv-buttons">
                                    <div class="tv-btn-dot"></div>
                                    <div class="tv-btn-dot"></div>
                                </div>
                                <div class="tv-title-1">Ome</div>
                                <div class="tv-title-2">TV</div>
                            </div>
                            <div class="app-stores">
                                <div class="store-badge">הורד מה <span>App Store</span></div>
                                <div class="store-badge" style="border-right: 1px solid #333; padding-right: 15px;">כעת ב- <span>Google Play</span></div>
                            </div>
                        </div>
                        <video id="remoteVideo" autoplay playsinline style="display: none; width: 100%; height: 100%; object-fit: cover;"></video>
                    </div>

                    <!-- מסך מצלמה שלך (ימין) -->
                    <div class="video-box">
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>
                </div>
                
                <!-- פאנל תחתון: כפתורים באמצע וצ'אט בצד ימין -->
                <div class="bottom-panel">
                    <div class="controls-group">
                        <button class="ctrl-btn" id="stopBtn">עצור</button>
                        <button class="ctrl-btn" id="startBtn">התחל</button>
                    </div>

                    <!-- צ'אט תחתון בצד ימין -->
                    <div class="chat-container">
                        <div class="chat-rules-banner">
                            ⚠️ על ידי לחיצה על "התחל", אתה מסכים לחוקים שלנו. מפרי החוקים ייחסמו. ודא שפניך נראים בתוך המסגרת.
                        </div>
                        <div class="messages"></div>
                        <div class="chat-input">
                            <input type="text" id="msgInput" placeholder="כתוב הודעה...">
                            <button class="emoji-btn">😊</button>
                            <button class="send-btn" id="sendBtn">שלח</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusDiv = document.getElementById('status');

        let localStream = null;
        let peerConnection = null;
        let currentPartnerId = null;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.textContent = 'המצלמה פועלת. לחץ על "התחל"';
            } catch (err) {
                statusDiv.textContent = 'שגיאה: אין גישה למצלמה';
            }
        }
        initCamera();

        startBtn.addEventListener('click', async () => {
            if (!localStream) {
                await initCamera();
                if (!localStream) return;
            }
            statusDiv.textContent = 'מחפש משתמש פנוי...';
            socket.emit('find-partner');
        });

        stopBtn.addEventListener('click', () => {
            resetPeerConnection();
            socket.emit('skip');
            statusDiv.textContent = 'השיחה נעצרה. לחץ על "התחל" לחיפוש חדש';
        });

        socket.on('waiting', () => {
            statusDiv.textContent = 'מחפש משתמשים נוספים...';
            resetPeerConnection();
        });

        socket.on('matched', async (data) => {
            currentPartnerId = data.partnerId;
            statusDiv.textContent = 'התחברת למשתמש! יוצר שיחה...';
            
            peerConnection = new RTCPeerConnection(iceServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = 'block';
                remotePlaceholder.style.display = 'none';
                statusDiv.textContent = 'מחובר!';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { offer, target: currentPartnerId });
            }
        });

        socket.on('offer', async (data) => {
            currentPartnerId = data.sender;
            peerConnection = new RTCPeerConnection(iceServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = 'block';
                remotePlaceholder.style.display = 'none';
                statusDiv.textContent = 'מחובר!';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { answer, target: currentPartnerId });
        });

        socket.on('answer', async (data) => {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        socket.on('partner-disconnected', () => {
            statusDiv.textContent = 'המשתמש השני התנתק. מחפש חדש...';
            resetPeerConnection();
            socket.emit('find-partner');
        });

        function resetPeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            remoteVideo.style.display = 'none';
            remotePlaceholder.style.display = 'flex';
            currentPartnerId = null;
        }

        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.querySelector('.messages');

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text !== '') {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message self';
                msgDiv.textContent = text;
                messagesContainer.appendChild(msgDiv);
                msgInput.value = '';
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
