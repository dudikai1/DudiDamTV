<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DudiDamTV</title>
    <style>
        body {
            margin: 0;
            background-color: #181818;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .tv-container {
            position: relative;
            width: 800px;
            max-width: 90vw;
            height: 450px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #remotePlaceholder {
            font-size: 24px;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .controls {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .btn-start {
            background-color: #0b3d20;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 160px;
            height: 100px;
        }
        .btn-next {
            background-color: #ff9800;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 160px;
            height: 100px;
        }
        .btn-stop {
            background-color: #4a2522;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 160px;
            height: 100px;
        }
        .btn-start:hover, .btn-next:hover, .btn-stop:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="tv-container">
        <div id="remotePlaceholder">לחץ על התחל כדי להתחיל</div>
        <video id="remoteVideo" autoplay playsinline style="display: none; width: 100%; height: 100%; object-fit: cover;"></video>
    </div>

    <div id="status">מוכן</div>

    <div class="controls">
        <button id="startBtn" class="btn-start">התחל</button>
        <button id="nextBtn" class="btn-next">הבא</button>
        <button id="stopBtn" class="btn-stop">עצור</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');
        const stopBtn = document.getElementById('stopBtn');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        let localStream = null;

        const socket = io();

        async function startSearch() {
            try {
                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                }
                if (statusDiv) statusDiv.textContent = 'מחפש משתמש...';
                if (remotePlaceholder) remotePlaceholder.style.display = 'none';
                if (remoteVideo) remoteVideo.style.display = 'block';
                
                socket.emit('find-partner');
            } catch (err) {
                console.error('שגיאה בגישה למצלמה:', err);
                if (statusDiv) statusDiv.textContent = 'שגיאה בגישה למצלמה';
            }
        }

        if (startBtn) startBtn.addEventListener('click', startSearch);
        if (nextBtn) nextBtn.addEventListener('click', startSearch);

        if (stopBtn) {
            stopBtn.addEventListener('click', () => {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                if (remotePlaceholder) remotePlaceholder.style.display = 'flex';
                if (remoteVideo) remoteVideo.style.display = 'none';
                if (statusDiv) statusDiv.textContent = 'הופסק';
            });
        }

        socket.on('update-user-count', (userCount) => {
            const countSpan = document.getElementById('count');
            if (countSpan) {
                countSpan.textContent = userCount;
            }
        });
    </script>
</body>
</html>
