<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DudiDamTV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* מסך הבית / לובי */
        #home-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background-image: radial-gradient(circle, #222 10%, #000 90%);
        }

        .tv-logo-box {
            background-color: #ff8a65;
            width: 220px;
            height: 140px;
            border-radius: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #ff7043;
            margin-bottom: 30px;
        }

        /* אנטנות של הטלוויזיה */
        .tv-logo-box::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 55px;
            width: 4px;
            height: 25px;
            background-color: #ff8a65;
            transform: rotate(-30deg);
            border-radius: 2px;
        }
        .tv-logo-box::after {
            content: '';
            position: absolute;
            top: -25px;
            right: 55px;
            width: 4px;
            height: 25px;
            background-color: #ff8a65;
            transform: rotate(30deg);
            border-radius: 2px;
        }

        /* כפתורים בצד הטלוויזיה */
        .tv-buttons {
            position: absolute;
            right: 12px;
            top: 45px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tv-btn-dot {
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
        }

        .tv-title-1 {
            color: #e0f2f1;
            font-size: 36px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .tv-title-2 {
            color: #69f0ae;
            font-size: 38px;
            font-weight: bold;
            font-family: monospace;
        }

        .start-chat-btn {
            background-color: #00e676;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 230, 118, 0.4);
            transition: 0.2s;
        }

        .start-chat-btn:hover {
            transform: scale(1.05);
            background-color: #00c853;
        }

        /* האתר הראשי (מוסתר בהתחלה) */
        #main-app {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        header { background-color: #1f1f1f; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; color: #00e676; border-bottom: 2px solid #333; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .video-container { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #000; position: relative; padding: 10px; }
        .videos { display: flex; width: 100%; height: 80%; gap: 10px; justify-content: center; align-items: center; }
        video { width: 48%; height: 100%; object-fit: cover; background-color: #222; border-radius: 8px; transform: scaleX(-1); }
        .controls { margin-top: 15px; display: flex; gap: 15px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-start { background-color: #00e676; color: #000; }
        .btn-next { background-color: #ff9800; color: #000; }
        .btn-stop { background-color: #f44336; color: #fff; }
        .chat-container { flex: 1; background-color: #1e1e1e; display: flex; flex-direction: column; border-right: 2px solid #333; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background-color: #333; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .message.self { align-self: flex-end; background-color: #00e676; color: #000; }
        .chat-input { display: flex; padding: 10px; background-color: #252525; }
        .chat-input input { flex: 1; padding: 10px; border: none; border-radius: 5px; background-color: #333; color: #fff; margin-left: 10px; }
        .chat-input button { background-color: #00e676; color: #000; }
        #status { position: absolute; top: 20px; background: rgba(0, 0, 0, 0.7); padding: 8px 16px; border-radius: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- מסך פתיחה עם הלוגו של הטלוויזיה -->
    <div id="home-screen">
        <div class="tv-logo-box">
            <div class="tv-buttons">
                <div class="tv-btn-dot"></div>
                <div class="tv-btn-dot"></div>
            </div>
            <div class="tv-title-1">DudiDam</div>
            <div class="tv-title-2">TV</div>
        </div>
        <button class="start-chat-btn" id="enterBtn">התחל שיחה</button>
    </div>

    <!-- האתר הראשי -->
    <div id="main-app">
        <header>DudiDamTV</header>
        <div class="main-container">
            <div class="chat-container">
                <div class="messages">
                    <div class="message">ברוך הבא ל-DudiDamTV!</div>
                </div>
                <div class="chat-input">
                    <button id="sendMsgBtn">שלח</button>
                    <input type="text" id="msgInput" placeholder="רשום הודעה...">
                </div>
            </div>

            <div class="video-container">
                <div id="status">לחץ על "התחל" כדי להפעיל מצלמה</div>
                <div class="videos">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
                <div class="controls">
                    <button class="btn-stop" id="stopBtn">הפסק</button>
                    <button class="btn-next" id="nextBtn">הבא</button>
                    <button class="btn-start" id="startBtn">התחל</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // מעבר ממסך הפתיחה לאתר הראשי והפעלת מצלמה אוטומטית
        const enterBtn = document.getElementById('enterBtn');
        const homeScreen = document.getElementById('home-screen');
        const mainApp = document.getElementById('main-app');
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const localVideo = document.getElementById('localVideo');
        const statusDiv = document.getElementById('status');
        let localStream = null;

        enterBtn.addEventListener('click', async () => {
            homeScreen.style.display = 'none';
            mainApp.style.display = 'flex';

            // הפעלה אוטומטית של המצלמה כשנכנסים
            try {
                statusDiv.textContent = 'מפעיל מצלמה...';
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.textContent = 'מחובר';
            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'שגיאה: אין גישה למצלמה';
            }
        });

        startBtn.addEventListener('click', async () => {
            try {
                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    localVideo.srcObject = localStream;
                }
                statusDiv.textContent = 'מחובר';
            } catch (err) {
                statusDiv.textContent = 'שגיאה: אין גישה למצלמה';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localVideo.srcObject = null;
                statusDiv.textContent = 'המצלמה הופסקה';
            }
        });

        // צ'אט
        const sendMsgBtn = document.getElementById('sendMsgBtn');
        const msgInput = document.getElementById('msgInput');
        const messagesContainer = document.querySelector('.messages');

        const sendMessage = () => {
            const text = msgInput.value.trim();
            if (text !== '') {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message self';
                msgDiv.textContent = text;
                messagesContainer.appendChild(msgDiv);
                msgInput.value = '';
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        };

        sendMsgBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
