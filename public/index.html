<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DudiDamTV</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #1a1a1a;
            padding: 10px 0;
            text-align: center;
            border-bottom: 1px solid #333;
            position: relative;
        }

        header h1 {
            margin: 0;
            color: #00c853;
            font-size: 24px;
        }

        .user-count {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #aaa;
        }

        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            max-width: 1300px;
            margin-top: 20px;
            gap: 20px;
            justify-content: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .left-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .videos-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        .video-box {
            width: 450px;
            height: 350px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid #333;
        }

        .logo-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 18px;
        }

        .logo-placeholder img {
            width: 80px;
            margin-bottom: 10px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .status-text {
            margin: 15px 0;
            font-size: 16px;
            color: #aaa;
            text-align: center;
            min-height: 24px;
        }

        /* Chat Panel */
        .chat-section {
            width: 320px;
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            height: 420px;
        }

        .chat-header {
            font-weight: bold;
            margin-bottom: 10px;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            font-size: 14px;
            color: #ccc;
        }

        #chat-input-area {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            outline: none;
        }

        #send-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            background-color: #00c853;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        /* Giant Bottom Controls matching the exact screenshot style */
        .controls-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin: 10px 0 40px 0;
            width: 100%;
        }

        .ctrl-btn {
            font-size: 42px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 260px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        #start-btn {
            background-color: #133a27; /* Exact dark green from your image */
            color: #b0c4bc;            /* Light muted text color */
        }

        #stop-btn {
            background-color: #3b2826;  /* Exact dark brown/reddish from your image */
            color: #b8aaa7;            /* Light muted text color */
        }
    </style>
</head>
<body>

    <header>
        <div class="user-count">משתמשים אונליין: <span id="count">0</span></div>
        <h1>DudiDamTV</h1>
    </header>

    <div class="main-container">
        <div class="left-content">
            <div class="videos-wrapper">
                <div class="video-box" id="box1">
                    <div class="logo-placeholder" id="placeholder1">
                        <img src="https://i.ibb.co/xYm813k/dudidam-tv-logo.png" alt="Logo">
                        DudiDam TV
                    </div>
                    <video id="video1" autoplay playsinline></video>
                </div>
                <div class="video-box" id="box2">
                    <div class="logo-placeholder" id="placeholder2">
                        <img src="https://i.ibb.co/xYm813k/dudidam-tv-logo.png" alt="Logo">
                        המצלמה פועלת בהצלחה!
                    </div>
                    <video id="video2" autoplay playsinline></video>
                </div>
            </div>

            <div id="status-text" class="status-text">לחץ על התחל כדי להתחיל</div>

            <!-- Giant Bottom Control Buttons -->
            <div class="controls-container">
                <button id="start-btn" class="ctrl-btn">התחל</button>
                <button id="stop-btn" class="ctrl-btn">עצור</button>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-section">
            <div class="chat-header">צ'אט</div>
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="message-input" placeholder="כתוב הודעה...">
                <button id="send-btn">שלח</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const video2 = document.getElementById('video2');
        const placeholder2 = document.getElementById('placeholder2');
        const statusText = document.getElementById('status-text');
        const countSpan = document.getElementById('count');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');

        let localStream = null;
        const socket = io();

        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                placeholder2.style.display = 'none';
                video2.style.display = 'block';
                video2.srcObject = localStream;
                statusText.textContent = 'מחפש משתמש...';
                socket.emit('find-partner');
            } catch (err) {
                console.error('שגיאה בגישה למצלמה:', err);
                statusText.textContent = 'שגיאה בגישה למצלמה. בדוק הרשאות.';
            }
        }

        function stopCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            video2.pause();
            video2.srcObject = null;
            video2.style.display = 'none';
            placeholder2.style.display = 'flex';
            statusText.textContent = 'הופסק';
            socket.emit('stop-search');
        }

        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);

        socket.on('update-user-count', (userCount) => {
            countSpan.textContent = userCount;
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                socket.emit('send-message', text);
                const msgDiv = document.createElement('div');
                msgDiv.textContent = `אני: ${text}`;
                msgDiv.style.color = '#00c853';
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('new-message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.textContent = `${data.username}: ${data.text}`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
