<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissim TV</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
            border-bottom: 1px solid #333;
        }
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }
        .video-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0b0b0b;
            position: relative;
            padding: 20px;
            border-left: 1px solid #222;
        }
        .videos-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
            align-items: center;
        }
        .video-box {
            width: 400px;
            height: 300px;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .placeholder {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
        }
        .logo-box {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .logo-box h2 {
            margin: 0;
            color: #fff;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .logo-box p {
            margin: 5px 0 0;
            color: #f1c40f;
            font-weight: bold;
            font-size: 14px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #start-btn {
            background-color: #1b5e20;
            color: white;
        }
        #start-btn:hover { background-color: #2e7d32; }
        #stop-btn {
            background-color: #3e2723;
            color: white;
        }
        #stop-btn:hover { background-color: #4e342e; }
        .chat-section {
            flex: 1;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-input-area {
            padding: 15px;
            background-color: #222;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #111;
            color: #fff;
        }
        .chat-input-area button {
            padding: 10px 20px;
            background-color: #1976d2;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>Nissim TV</header>

    <div class="main-container">
        <!-- אזור הוידאו -->
        <div class="video-section">
            <div style="color: #bbb; margin-bottom: 15px; font-size: 14px;">לחץ על "התחל" כדי להתחבר</div>
            <div class="videos-wrapper">
                <!-- תיבה שמאלית - המצלמה שלך -->
                <div class="video-box">
                    <div id="localPlaceholder" class="placeholder">
                        <div class="logo-box">
                            <h2>NISSIM</h2>
                            <p>TV</p>
                        </div>
                    </div>
                    <video id="localvideo" autoplay playsinline muted></video>
                </div>
                <!-- תיבה ימנית - המצלמה של הצד השני -->
                <div class="video-box">
                    <div id="remotePlaceholder" class="placeholder">
                        <div style="color: #777;">מחפש משתמש נוסף...</div>
                    </div>
                    <video id="remotevideo" autoplay playsinline></video>
                </div>
            </div>

            <div class="controls">
                <button id="stop-btn">עצור</button>
                <button id="start-btn">התחל</button>
            </div>
        </div>

        <!-- אזור הצ'אט -->
        <div class="chat-section">
            <div id="messagesContainer" class="chat-messages">
                <div style="color: #888; text-align: center;">ברוך הבא ל-Nissim TV!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="רשום הודעה...">
                <button id="sendMsgBtn">שלח</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        let peerConnection;
        let currentPartnerId = null;

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        document.getElementById('start-btn').addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const localVideo = document.getElementById('localvideo');
                localVideo.srcObject = localStream;
                localVideo.style.display = 'block';
                document.getElementById('localPlaceholder').style.display = 'none';

                socket.emit('join-room');
            } catch (err) {
                console.error('שגיאה בגישה למצלמה:', err);
                alert('לא ניתן לגשת למצלמה.');
            }
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peerConnection) {
                peerConnection.close();
            }
            window.location.reload();
        });

        socket.on('partner-found', async (data) => {
            currentPartnerId = data.partnerId;
            peerConnection = new RTCPeerConnection(iceServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remotevideo');
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = 'block';
                document.getElementById('remotePlaceholder').style.display = 'none';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { offer, target: currentPartnerId });
            }
        });

        socket.on('offer', async (data) => {
            currentPartnerId = data.sender;
            peerConnection = new RTCPeerConnection(iceServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remotevideo');
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = 'block';
                document.getElementById('remotePlaceholder').style.display = 'none';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { answer, target: currentPartnerId });
        });

        socket.on('answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection && data.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        const sendMessage = () => {
            const input = document.getElementById('msgInput');
            if (!input.value.trim()) return;
            const msgContainer = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.textContent = input.value;
            msgContainer.appendChild(div);
            msgContainer.scrollTop = msgContainer.scrollHeight;
            input.value = '';
        };

        document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
