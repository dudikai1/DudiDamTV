<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DudiDamTV</title>
    <meta name="description" content="DudiDamTV - צ'אט וידאו חי ואקראי עם משתמשים">
    <meta name="google-site-verification" content="lwEexITiGQHXWsZ0KAA-hA1du-mr9AXxTxInziPZqUA" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .tv-logo-box {
            background-color: #ff8a65;
            width: 180px;
            height: 115px;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid #ff7043;
        }

        .tv-logo-box::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(-30deg);
            border-radius: 2px;
        }
        .tv-logo-box::after {
            content: '';
            position: absolute;
            top: -20px;
            right: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(30deg);
            border-radius: 2px;
        }

        .tv-buttons {
            position: absolute;
            right: 10px;
            top: 35px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tv-btn-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
        }

        .tv-title-1 { color: #fff; font-size: 30px; font-weight: bold; font-family: monospace; letter-spacing: 1px; }
        .tv-title-2 { color: #69f0ae; font-size: 32px; font-weight: bold; font-family: monospace; }

        #main-app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        header { background-color: #1f1f1f; padding: 12px; text-align: center; font-size: 20px; font-weight: bold; color: #00e676; border-bottom: 2px solid #333; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .video-container { 
            flex: 2; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background-color: #000; 
            position: relative; 
            padding: 10px; 
        }
        
        .videos { display: flex; width: 100%; height: 62%; gap: 10px; justify-content: center; align-items: center; }
        
        .video-box {
            width: 48%;
            height: 100%;
            position: relative;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
        }

        video { width: 100%; height: 100%; object-fit: cover; background-color: #1a1a1a; }
        #localVideo { transform: scaleX(-1); }

        #remotePlaceholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            background-color: #181818;
        }

        /* כפתורים ענקיים תואמים לעיצוב שלך */
        .controls { 
            margin-top: 15px; 
            display: flex; 
            gap: 25px; 
            align-items: center; 
            justify-content: center; 
            width: 100%;
        }
        
        .ctrl-giant-btn {
            font-size: 36px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 240px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-giant-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        #startBtn { 
            background-color: #133a27; /* ירוק כהה מדויק */
            color: #b0c4bc;            
        }
        
        #stopBtn { 
            background-color: #3b2826;  /* חום/אדום כהה מדויק */
            color: #b8aaa7;            
        }
        
        .chat-container { flex: 1; background-color: #1e1e1e; display: flex; flex-direction: column; border-right: 2px solid #333; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background-color: #333; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .message.self { align-self: flex-end; background-color: #00e676; color: #000; }
        .chat-input { display: flex; padding: 10px; background-color: #252525; }
        .chat-input input { flex: 1; padding: 10px; border: none; border-radius: 5px; background-color: #333; color: #fff; margin-left: 10px; }
        .chat-input button { background-color: #00e676; color: #000; }
        #status { position: absolute; top: 15px; background: rgba(0, 0, 0, 0.7); padding: 6px 14px; border-radius: 20px; font-size: 13px; z-index: 10; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; }
            .chat-container { height: 35%; border-right: none; border-top: 2px solid #333; }
            .video-container { height: 65%; }
            .ctrl-giant-btn { width: 150px; height: 80px; font-size: 24px; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="main-app">
        <header>DudiDamTV</header>
        <div class="main-container">
            <div class="chat-container">
                <div class="messages">
                    <div class="message">ברוך הבא ל-DudiDamTV!</div>
                </div>
                <div class="chat-input">
                    <button id="sendMsgBtn">שלח</button>
                    <input type="text" id="msgInput" placeholder="רשום הודעה...">
                </div>
            </div>

            <div class="video-container">
                <div id="status">לחץ על "התחל" כדי להתחבר</div>
                <div class="videos">
                    <!-- המצלמה שלך (שמאל) -->
                    <div class="video-box">
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>

                    <!-- מסך הצד השני (ימין) -->
                    <div class="video-box" id="remoteBox">
                        <div id="remotePlaceholder">
                            <div class="tv-logo-box">
                                <div class="tv-buttons">
                                    <div class="tv-btn-dot"></div>
                                    <div class="tv-btn-dot"></div>
                                </div>
                                <div class="tv-title-1">DudiDam</div>
                                <div class="tv-title-2">TV</div>
                            </div>
                        </div>
                        <video id="remoteVideo" autoplay playsinline style="display: none; width: 100%; height: 100%; object-fit: cover;"></video>
                    </div>
                </div>
                
                <!-- כפתורים ענקיים -->
                <div class="controls">
                    <button class="ctrl-giant-btn" id="startBtn">התחל</button>
                    <button class="ctrl-giant-btn" id="stopBtn">עצור</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusDiv = document.getElementById('status');

        let localStream = null;
        let peerConnection = null;
        let currentPartnerId = null;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // הפעלת מצלמה אוטומטית בעליית האתר
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.textContent = 'המצלמה פועלת. לחץ על "התחל"';
            } catch (err) {
                statusDiv.textContent = 'שגיאה: אין גישה למצלמה';
            }
        }
        initCamera();

        startBtn.addEventListener('click', async () => {
            if (!localStream) {
                await initCamera();
                if (!localStream) return;
            }
            statusDiv.textContent = 'מחפש משתמש פנוי...';
            socket.emit('find-partner');
        });

        // לחיצה על "עצור" - מתנתקת מהשיחה
        stopBtn.addEventListener('click', () => {
            resetPeerConnection();
            socket.emit('skip');
            statusDiv.textContent = 'הופסק';
        });

        socket.on('waiting', () => {
            statusDiv.textContent = 'מחפש משתמשים נוספים...';
            resetPeerConnection();
        });

        // נמצא חיבור!
        socket.on('matched', async (data) => {
            currentPartnerId = data.partnerId;
            statusDiv.textContent = 'התחברת למשתמש! יוצר שיחה...';
            
            peerConnection = new RTCPeerConnection(iceServers);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.style.display = 'block';
                remotePlaceholder.style.display = 'none';
                statusDiv.textContent = 'מחובר!';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { offer, target: currentPartnerId });
            }
        });

        socket.on('offer', async (data) => {
            currentPartnerId = data.sender;
          peerConnection = new RTCPeerConnection({
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
    ]
});
});           

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = (event) => {
        const remoteVideo = document.getElementById('remoteVideo');
        if (remoteVideo) {
            remoteVideo.srcObject = event.streams[0];
            remoteVideo.style.display = 'block';
        }
        if (typeof remotePlaceholder !== 'undefined' && remotePlaceholder) {
            remotePlaceholder.style.display = 'none';
        }
        if (typeof statusDiv !== 'undefined' && statusDiv) {
            statusDiv.textContent = 'מחובר!';
        }
    };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, target: currentPartnerId });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { answer, target: currentPartnerId });
        });

        socket.on('answer', async (data) => {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        socket.on('partner-disconnected', () => {
            statusDiv.textContent = 'המשתמש השני התנתק. מחפש חדש...';
            resetPeerConnection();
            socket.emit('find-partner');
        });

        function resetPeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            remoteVideo.style.display = 'none';
            remotePlaceholder.style.display = 'flex';
            currentPartnerId = null;
        }
stopBtn.addEventListener('click', () => {
    resetPeerConnection();
    socket.emit('skip');
    statusDiv.textContent = "Stopped";
});

const sendMsgBtn = document.getElementById('sendMsgBtn');
const msgInput = document.getElementById('msgInput');
const messagesContainer = document.querySelector('.messages');

const sendMessage = () => {
    const text = msgInput.value.trim();
    if (text !== '') {
        // שליחת ההודעה לבן-הזוג דרך השרת
        socket.emit('chat-message', { text: text, sender: socket.id });

        // הצגת ההודעה אצלך
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message self';
        msgDiv.textContent = text;
        messagesContainer.appendChild(msgDiv);
        msgInput.value = '';
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
};
        // קבלת הודעה מבן-הזוג
socket.on('chat-message', (data) => {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message partner';
    msgDiv.textContent = data.text;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
});

sendMsgBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});
msgDiv.textContent = data.text;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
});

sendMsgBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// המאזין של כפתור ההתחל בתוך הסקריפט:
document.getElementById('start-btn').addEventListener('click', async () => {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        
        const localVideo = document.getElementById('localVideo');
        if (localVideo) {
            localVideo.srcObject = localStream;
            localVideo.style.display = 'block';
        }
        
        const localPlaceholder = document.getElementById('localPlaceholder');
        if (localPlaceholder) {
            localPlaceholder.style.display = 'none';
        }

        socket.emit('find-partner');
    } catch (err) {
        console.error("שגיאה בגישה למצלמה:", err);
        alert("לא ניתן לגשת למצלמה. ודא שאפשרת גישה בדפדפן.");
    }
});
</script>
