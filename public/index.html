<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DudiDamTV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* רקע שלג משותף */
        .noise-bg {
            background-color: #222;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.15"/></svg>');
        }

        /* עיצוב לוגו הטלוויזיה */
        .tv-logo-box {
            background-color: #ff8a65;
            width: 180px;
            height: 115px;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid #ff7043;
        }

        .tv-logo-box::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(-30deg);
            border-radius: 2px;
        }
        .tv-logo-box::after {
            content: '';
            position: absolute;
            top: -20px;
            right: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(30deg);
            border-radius: 2px;
        }

        .tv-buttons {
            position: absolute;
            right: 10px;
            top: 35px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tv-btn-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
        }

        .tv-title-1 {
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .tv-title-2 {
            color: #69f0ae;
            font-size: 32px;
            font-weight: bold;
            font-family: monospace;
        }

        #main-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header { background-color: #1f1f1f; padding: 12px; text-align: center; font-size: 20px; font-weight: bold; color: #00e676; border-bottom: 2px solid #333; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .video-container { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #000; position: relative; padding: 10px; }
        
        .videos { display: flex; width: 100%; height: 80%; gap: 10px; justify-content: center; align-items: center; }
        
        .video-box {
            width: 48%;
            height: 100%;
            position: relative;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
        }

        video { width: 100%; height: 100%; object-fit: cover; background-color: #1a1a1a; }
        #localVideo { transform: scaleX(-1); }

        #remotePlaceholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .controls { margin-top: 15px; display: flex; gap: 15px; align-items: center; }
        button { padding: 10px 22px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-start { background-color: #00e676; color: #000; }
        .btn-next { background-color: #ff9800; color: #000; }
        .btn-stop { background-color: #f44336; color: #fff; }
        .btn-ban-test { background-color: #9c27b0; color: #fff; font-size: 14px; padding: 8px 12px; }
        
        .chat-container { flex: 1; background-color: #1e1e1e; display: flex; flex-direction: column; border-right: 2px solid #333; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background-color: #333; padding: 8px 12px; border-radius: 5px; max-width: 80%; }
        .message.self { align-self: flex-end; background-color: #00e676; color: #000; }
        .chat-input { display: flex; padding: 10px; background-color: #252525; }
        .chat-input input { flex: 1; padding: 10px; border: none; border-radius: 5px; background-color: #333; color: #fff; margin-left: 10px; }
        .chat-input button { background-color: #00e676; color: #000; }
        #status { position: absolute; top: 15px; background: rgba(0, 0, 0, 0.7); padding: 6px 14px; border-radius: 20px; font-size: 13px; z-index: 10; }

        /* מסך באן מלא שחוסם את הכל */
        #banModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .ban-box {
            background-color: #1f1f1f;
            border: 3px solid #f44336;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(244, 67, 54, 0.4);
        }

        .ban-box h2 { color: #f44336; font-size: 28px; margin-bottom: 15px; }
        .ban-box p { color: #ccc; font-size: 16px; margin-bottom: 20px; line-height: 1.5; }
        
        .paypal-btn {
            background-color: #0070ba;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .paypal-btn:hover { background-color: #005ea6; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; }
            .chat-container { height: 35%; border-right: none; border-top: 2px solid #333; }
            .video-container { height: 65%; }
        }
    </style>
</head>
<body>

    <!-- מסך הבאן (מוסתר כברירת מחדל) -->
    <div id="banModal">
        <div class="ban-box">
            <h2>קיבלת באן לצמיתות! 🚨</h2>
            <p>החשבון/הכתובת שלך חסומים עקב הפרת תנאי השימוש (הצגת תוכן אסור, אצבע שלישית או עירום).</p>
            <p>רוצה להסיר את הבאן ולחזור לאתר? יש לבצע תשלום חד-פעמי לשחרור.</p>
            <button class="paypal-btn" id="payPalBtn">
                שחרר באן דרך PayPal (10.00 ₪)
            </button>
        </div>
    </div>

    <div id="main-app">
        <header>DudiDamTV</header>
        <div class="main-container">
            <div class="chat-container">
                <div class="messages">
                    <div class="message">ברוך הבא ל-DudiDamTV!</div>
                </div>
                <div class="chat-input">
                    <button id="sendMsgBtn">שלח</button>
                    <input type="text" id="msgInput" placeholder="רשום הודעה...">
                </div>
            </div>

            <div class="video-container">
                <div id="status">ממתין להפעלה...</div>
                <div class="videos">
                    <div class="video-box">
                        <video id="localVideo" autoplay playsinline muted></video>
                    </div>
                    
                    <div class="video-box noise-bg" id="remoteBox">
                        <div id="remotePlaceholder">
                            <div class="tv-logo-box">
                                <div class="tv-buttons">
                                    <div class="tv-btn-dot"></div>
                                    <div class="tv-btn-dot"></div>
                                </div>
                                <div class="tv-title-1">DudiDam</div>
                                <div class="tv-title-2">TV</div>
                            </div>
                        </div>
                        <video id="remoteVideo" autoplay playsinline style="position: relative; z-index: 6; display: none;"></video>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn-stop" id="stopBtn">הפסק</button>
                    <button class="btn-next" id="nextBtn">הבא</button>
                    <button class="btn-start" id="startBtn">התחל</button>
                    <!-- כפתור לבדיקה שפותח את מסך הבאן -->
                    <button class="btn-ban-test" id="banTestBtn">בדיקת באן 🛑</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const nextBtn = document.getElementById('nextBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const statusDiv = document.getElementById('status');
        const banModal = document.getElementById('banModal');
        const banTestBtn = document.getElementById('banTestBtn');
        const payPalBtn = document.getElementById('payPalBtn');
        let localStream = null;

        window.addEventListener('load', async () => {
            try {
                statusDiv.textContent = 'מפעיל מצלמה...';
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusDiv.textContent = 'מחובר (מוכן להתחלה)';
            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'שגיאה: אין גישה למצלמה';
            }
        });

        startBtn.addEventListener('click', () => {
            statusDiv.textContent = 'מחפש משתמש... (אין כרגע משתמשים אחרים)';
            remotePlaceholder.style.display = 'flex';
            remoteVideo.style.display = 'none';
        });

        stopBtn.addEventListener('click', () => {
            remotePlaceholder.style.display = 'flex';
            remoteVideo.style.display = 'none';
            remoteVideo.srcObject = null;
            statusDiv.textContent = 'הופסק';
        });

        nextBtn.addEventListener('click', () => {
            statusDiv.textContent = 'מחפש משתמש חדש...';
            remotePlaceholder.style.display, remotePlaceholder.style.display = 'flex';
            remoteVideo.style.display = 'none';
        });

        // כפתור לדוגמה שמדמה קבלת באן
        banTestBtn.addEventListener('click', () => {
            banModal.style.display = 'flex';
        });

        // לחיצה על כפתור התשלום של פייפאל (כאילו שילם והבאן ירד)
        payPalBtn.addEventListener('click', () => {
            alert('התשלום בוצע בהצלחה דרך PayPal! הבאן הוסר.');
            banModal.style.display = 'none';
        });

        const sendMsgBtn = document.getElementById('sendMsgBtn');
        const msgInput = document.getElementById('msgInput');
        const messagesContainer = document.querySelector('.messages');

        const sendMessage = () => {
            const text = msgInput.value.trim();
            if (text !== '') {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message self';
                msgDiv.textContent = text;
                messagesContainer.appendChild(msgDiv);
                msgInput.value = '';
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        };

        sendMsgBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
