<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DudiDamTV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* רקע שלג משותף */
        .noise-bg {
            background-color: #222;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.15"/></svg>');
        }

        /* עיצוב לוגו הטלוויזיה */
        .tv-logo-box {
            background-color: #ff8a65;
            width: 180px;
            height: 115px;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid #ff7043;
        }

        .tv-logo-box::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(-30deg);
            border-radius: 2px;
        }
        .tv-logo-box::after {
            content: '';
            position: absolute;
            top: -20px;
            right: 45px;
            width: 4px;
            height: 20px;
            background-color: #ff8a65;
            transform: rotate(30deg);
            border-radius: 2px;
        }

        .tv-buttons {
            position: absolute;
            right: 10px;
            top: 35px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tv-btn-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
        }

        .tv-title-1 {
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .tv-title-2 {
            color: #69f0ae;
            font-size: 32px;
            font-weight: bold;
            font-family: monospace;
        }

        #main-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header { background-color: #1f1f1f; padding: 12px; text-align: center; font-size: 20px; font-weight: bold; color: #00e676; border-bottom: 2px solid #333; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .video-container { flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #000; position: relative; padding: 10px; }
        
        .videos { display: flex; width: 100%; height: 80%; gap: 10px; justify-content: center; align-items: center; }
        
        .video-box {
            width: 48%;
            height: 100%;
            position: relative;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
        }

        video { width: 100%; height: 100%; object-fit: cover; background-color: #1a1a1a; }
        #localVideo { transform: scaleX(-1); }

        /* הלוגו שיושב בתוך המסך השמאלי כשאין שיחה */
        #remotePlaceholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .controls { margin-top: 15px; display: flex; gap: 15px; }
        button { padding: 10px 22px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
